@if (isLoading()) {
  <div class="global-loader" [class.fade-out]="isFadingOut()">
    <div class="loader-content">
      
      <!-- Logo revealed through CSS mask animation -->
      <img src="/logo.webp" alt="Just Agro Group Logo" class="loader-logo" />
      
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      
    </div>
  </div>
}

<app-navbar></app-navbar>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
