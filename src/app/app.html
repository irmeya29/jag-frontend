@if (isLoading()) {
<div class="global-loader premium-loader" [class.fade-out]="isFadingOut()">

  <!-- Massive Background Counter -->
  <div class="loader-massive-counter">
    {{ loadingPercentage() }}<span class="percent-sign">%</span>
  </div>

  <div class="loader-content">
    <!-- Central Logo -->
    <div class="loader-logo-wrapper">
      <div class="loader-rings"></div>
      <div class="loader-logo-inner">
        <img src="/logo.webp" alt="Just Agro Group Logo" class="loader-logo" />
        <div class="logo-glare"></div>
      </div>
    </div>

    <div class="loading-label">CHARGEMENT DE L'EXPÉRIENCE</div>
  </div>

  <!-- Absolute Bottom Progress Bar -->
  <div class="progress-container-bottom">
    <div class="progress-fill" [style.width.%]="loadingPercentage()"></div>
  </div>

</div>
}

<app-navbar></app-navbar>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
